name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drugsafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drugsafe_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drugsafe_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      REFRESH_TOKEN_SECRET: ci-refresh-secret-ci-refresh-secret
      SEED_ADMIN_PASSWORD: DevAdmin!2345
      SEED_DOCTOR_PASSWORD: DevDoctor!2345
      SEED_PHARMACIST_PASSWORD: DevPharm!2345
      SEED_PATIENT_PASSWORD: DevPatient!2345

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npx prisma validate

      - run: npm run lint

      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
