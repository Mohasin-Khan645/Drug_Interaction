version: '3.8'

services:
  # 1. Authoritative Clinical PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: drugsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: drugsafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. DrugSafe Core Express Clinical Engine Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drugsafe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/drugsafe?schema=public"
      JWT_ACCESS_SECRET: "drugsafe-production-access-secret-32-chars-key"
      JWT_ACCESS_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "drugsafe-production-refresh-secret-32-chars-key"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      CLIENT_URL: "http://localhost:3000"
      OCR_PROVIDER: "development"
      AI_PROVIDER: "development"
      STORAGE_PROVIDER: "local"
      STORAGE_BUCKET: "drugsafe-prescriptions"
    volumes:
      - uploads_data:/app/uploads

  # 3. DrugSafe High-Tech Clinical Frontend (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drugsafe-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "80:80"

volumes:
  pgdata:
    name: drugsafe_postgres_data
  uploads_data:
    name: drugsafe_uploads_data

